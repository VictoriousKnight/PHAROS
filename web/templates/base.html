<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Pharos CDR - Document Malware Analysis and Content Disarm & Reconstruction"
    >

    <meta
        name="robots"
        content="noindex,nofollow"
    >

    <title>
        {% block title %}Pharos CDR{% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/app.css') }}"
    >

    {% block head %}{% endblock %}
</head>

<body>

<header class="site-header">
    <div class="container header-inner">

        <a
            href="{{ url_for('index') }}"
            class="brand"
            aria-label="Pharos CDR home"
        >
            <span class="brand-mark" aria-hidden="true">
                P
            </span>

            <span class="brand-text">
                <span class="brand-name">PHAROS</span>
                <span class="brand-subtitle">CDR</span>
            </span>
        </a>

        <nav
            class="main-navigation"
            aria-label="Main navigation"
        >
            <a
                href="{{ url_for('index') }}"
                class="nav-link {% if request.endpoint == 'index' %}active{% endif %}"
            >
                Dashboard
            </a>

            <a
                href="{{ url_for('scan_page') }}"
                class="nav-link {% if request.endpoint == 'scan_page' %}active{% endif %}"
            >
                Scan
            </a>

            <a
                href="{{ url_for('api_health') }}"
                class="nav-link"
            >
                API
            </a>
        </nav>

    </div>
</header>


<main class="main-content">

    {% block content %}{% endblock %}

</main>


<footer class="site-footer">
    <div class="container footer-inner">

        <div>
            <strong>Pharos CDR</strong>
            <span class="footer-separator">•</span>
            Defensive Document Analysis
        </div>

        <div class="footer-meta">
            Static analysis · ML detection · CDR sanitization
        </div>

    </div>
</footer>


<script
    src="{{ url_for('static', filename='js/app.js') }}"
    defer
></script>

{% block scripts %}{% endblock %}

</body>
</html>
