services:
  - type: web
    name: pharos-cdr
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "web.app:app" --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 120
    envVars:
      - key: PHAROS_SECRET_KEY
        generateValue: true          # Render auto-generates a secure random value
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.12"
