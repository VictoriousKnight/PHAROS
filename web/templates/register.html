{% extends "base.html" %}

{% block title %}Register - PHAROS CDR{% endblock %}

{% block content %}
<div class="auth-container">
  <div class="card">
    <h1 class="card-title">Create Account</h1>
    <p class="card-subtitle">Register to unlock full document disarm, sanitization, and audit reporting.</p>

    <form method="POST" action="/register">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input class="form-input" type="text" id="username" name="username" required autocomplete="username" autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Work Email</label>
        <input class="form-input" type="email" id="email" name="email" required autocomplete="email">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password (min. 6 characters)</label>
        <input class="form-input" type="password" id="password" name="password" required minlength="6" autocomplete="new-password">
      </div>

      <button type="submit" class="btn btn-accent btn-block" style="margin-top: 1.5rem;">
        Register Account
      </button>
    </form>

    <div style="margin-top: 1.5rem; text-align: center; font-size: 0.85rem; color: var(--text-muted);">
      Already registered? <a href="/login" style="color: var(--brand-accent); text-decoration: none; font-weight: 600;">Sign in here</a>
    </div>
  </div>
</div>
{% endblock %}
