{% extends "base.html" %}

{% block title %}Sign In - PHAROS CDR{% endblock %}

{% block content %}
<div class="auth-container">
  <div class="card">
    <h1 class="card-title">Sign In</h1>
    <p class="card-subtitle">Authenticate to access the CDR Disarm and Analysis portal.</p>

    <form method="POST" action="/login">
      <div class="form-group">
        <label class="form-label" for="username">Username or Email</label>
        <input class="form-input" type="text" id="username" name="username" required autocomplete="username" autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-input" type="password" id="password" name="password" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1.5rem;">
        Authenticate
      </button>
    </form>

    <div style="margin-top: 1.5rem; text-align: center; font-size: 0.85rem; color: var(--text-muted);">
      Don't have an account? <a href="/register" style="color: var(--brand-accent); text-decoration: none; font-weight: 600;">Register here</a>
    </div>
  </div>
</div>
{% endblock %}
